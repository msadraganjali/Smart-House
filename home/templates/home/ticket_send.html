{% extends "account/base.html" %}
<!-- forme register kardan karbar -->
{% block content %}
{% load static %}
<section class="vh-100" style="background-color: #eee; font-family: 'Vazir' !important; text-align: right;">
  <div class="container h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-lg-12 col-xl-11">
        <div class="card text-black" style="border-radius: 25px;">
          <div class="card-body p-md-5">
            <div class="row justify-content-center">
              <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">
                <!-- title marbot be form -->
                <p class="text-center h1 fw-bold mb-5 mx-1 mx-md-4 mt-4">ارسال تیکت</p>
                <form class="mx-1 mx-md-4" method="post" action="{% url 'home:addTicket' %}">{% csrf_token %}
                  <!-- field name karbary -->
                  <div class="d-flex flex-row align-items-center mb-4">
                    <div class="form-outline flex-fill mb-0" dir="rtl">
                      <label class="form-label" for="username">نوع تیکت:</label><br>
                      <select name="type" id="type" class="form-control">
                        <option value="0">تغییر پکیج</option>
                        <option value="1">پرسیدن سوال</option>
                        <option value="2">گزارش باگ</option>
                      </select>
                      <p class="text-danger">{{ form.type.errors | first }}</p>
                    </div>
                  </div>

                  <!-- field name kalame obor  -->
                  <div class="d-flex flex-row align-items-center mb-4">
                    <div class="form-outline flex-fill mb-0">
                      <label class="form-label" for="title">:عنوان تیکت</label>
                      <input type="text" id="title" class="form-control" name="title" />
                      <p class="text-danger">{{ form.title.errors | first }}</p>
                    </div>
                  </div>
                  <div class="d-flex flex-row align-items-center mb-4">
                    <div class="form-outline flex-fill mb-0">
                      <label class="form-label" for="description">:شرح تیکت</label>
                      <textarea name="description" id="description" class="form-control"></textarea>
                      <p class="text-danger">{{ form.description.errors | first }}</p>
                    </div>
                  </div>
                  <!-- gereftan taahod -->
                  <div class="form-check d-flex justify-content-center mb-4">
                    <li style="direction: rtl;"><u><i><b>من تمام شرایط ارایه خدمات را می‌پذیرم!</b></i></u></p>
                  </div>
                  <!-- link kardan be safhe register -->
                  <!-- dokme vorod -->
                  <div class="d-flex justify-content-center mx-4 mb-3 mb-lg-4">
                    <button type="submit" class="btn btn-primary btn-lg">ارسال تیکت</button>
                  </div>

                </form>

              </div>
              <div class="col-md-10 col-lg-6 col-xl-7 d-flex align-items-center order-1 order-lg-2">
                <!-- load kardan image -->
                <img src="{% static 'ticket/ticket.jpg' %}" class="img-fluid" alt="Sample image"
                  style="border-radius: 5%">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock content %}
