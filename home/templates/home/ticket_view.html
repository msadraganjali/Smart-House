{% extends "account/base.html" %}
<!-- forme register kardan karbar -->
{% block content %}
{% load static %}
<section class="vh-100" style="background-color: #eee; font-family: 'Vazir' !important; text-align: right;">
    <div class="container h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-lg-12 col-xl-11">
                <div class="card text-black" style="border-radius: 25px;">
                    <div class="card-body p-md-5">
                        <div class="row justify-content-center">
                            <div class="col-md-12 col-lg-8 col-xl-7 order-2 order-lg-1">
                                <!-- title marbot be form -->
                                <p class="text-center h3 fw-bold mb-5 mx-1 mx-md-4 mt-4">{{ ticket.title }}</p>
                                <p><b>{{ ticket.id }}</b> :شماره تیکت</p>
                                <p> :متن تیکت</p>
                                <textarea disabled="true" class="form-control"
                                    dir="rtl" id="description">{{ ticket.description }}</textarea><br>
                                {% if ticket.response %}
                                <p>:جواب کارمند</p>
                                <textarea disabled="true" class="form-control"
                                    dir="rtl" id="response">{{ ticket.response }}</textarea>
                                {% else %}
                                <p class="alert alert-danger">. به این تیکت پاسخ داده نشده</p>
                                {% endif %}
                                <small>زمان ساخته شدن تیکت: {{ jdate     }}</small>
                            </div>
                            <div class="col-md-8 col-lg-4 col-xl-5 d-flex align-items-center order-1 order-lg-2">
                                <!-- load kardan image -->
                                <img src="{% static 'ticket/ticket.jpg' %}" class="img-fluid" alt="Sample image"
                                    style="border-radius: 5%">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{% static "autosize/autosize/dist/autosize.min.js" %}"></script>
    <script>
        autosize(document.getElementById('response'));
    </script>
</section>
<script>
    
</script>
{% endblock content %}
